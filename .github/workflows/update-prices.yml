# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
name: Publish site with floor prices

# Publishes Swamp Swap to GitHub Pages together with a fresh prices.json snapshot.
# Runs every 30 minutes, whenever files are pushed to main (e.g. a new index.html), and on demand.
on:
  schedule:
    # :17 and :47 past each hour (UTC), away from GitHub's busy top-of-hour.
    - cron: "17,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          # Start from the currently published prices so a failed lookup never blanks them.
          curl -fsSL "https://evstephent.github.io/swamp-swap/prices.json" -o _site/prices.json || echo "No published prices.json yet."

      - name: Fetch floor prices from OpenSea
        continue-on-error: true
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: node snapshot-prices.mjs _site/prices.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
