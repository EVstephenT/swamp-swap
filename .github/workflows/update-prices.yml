name: Publish site with floor prices

# Publishes Swamp Swap to GitHub Pages together with a fresh prices.json snapshot.
# Runs every 30 minutes, whenever files are pushed to main (e.g. a new index.html), and on demand.
on:
  schedule:
    # :17 and :47 past each hour (UTC), away from GitHub's busy top-of-hour.
    - cron: "17,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          # Start from the currently published prices so a failed lookup never blanks them.
          curl -fsSL "https://evstephent.github.io/swamp-swap/prices.json" -o _site/prices.json || echo "No published prices.json yet."

      - name: Fetch floor prices from OpenSea
        continue-on-error: true
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: node snapshot-prices.mjs _site/prices.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
